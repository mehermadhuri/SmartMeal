services:
  # Spring Boot Java 17 Backend
  - type: web
    name: smartmeal-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        value: http://localhost:8000

  # FastAPI Python AI Microservice (optional separate deploy)
  - type: web
    name: smartmeal-ai
    env: docker
    dockerfilePath: ai-service/Dockerfile
    dockerContext: ai-service
    plan: free
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
