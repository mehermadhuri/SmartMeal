# render.yaml — Render deployment configuration for SmartMeal backend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smartmeal-backend
    runtime: java
    plan: free
    region: oregon

    # Build: compile with Maven wrapper (skipping tests for faster deploys)
    buildCommand: cd backend && ./mvnw clean package -DskipTests

    # Start: run the built JAR (Render injects PORT automatically)
    startCommand: java -jar backend/target/task-manager-0.0.1-SNAPSHOT.jar

    # Health check endpoint (Render pings this to confirm startup success)
    healthCheckPath: /api/tasks

    # Environment variables – set SECRET values in Render dashboard, not here
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false   # Set this in Render Dashboard → Environment
      - key: DB_USERNAME
        sync: false   # Set this in Render Dashboard → Environment
      - key: DB_PASSWORD
        sync: false   # Set this in Render Dashboard → Environment
