# Spring Application Name & Port
spring.application.name=smartmeal-backend
server.port=${PORT:8081}

# Database Configuration (Environment variable driven, supports local MySQL & Aiven Cloud)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartmeal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Configuration
jwt.secret=${JWT_SECRET:smartmeal-production-secret-key-at-least-32-chars-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI Microservice URL
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Optional administrator bootstrap credentials. Never set these to demo/default values.
smartmeal.admin.email=${ADMIN_EMAIL:}
smartmeal.admin.password=${ADMIN_PASSWORD:}
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.smartmeal=INFO
