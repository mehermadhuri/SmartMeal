spring.application.name=task-manager
# Port 8081 is used to avoid conflict with Oracle TNSLSNR / existing services on port 8080
server.port=${PORT:8081}

# =======================================================
# MySQL Database Configuration
# =======================================================
# On Render: set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables.
# Local fallback: localhost MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================================================
# JPA / Hibernate Configuration
# =======================================================
# Automatically creates or updates the database schema/tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true