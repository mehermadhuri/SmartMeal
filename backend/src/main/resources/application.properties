# Spring Application Name & Port
spring.application.name=smartmeal-backend
server.port=${PORT:8081}

# Database Configuration (Environment variable driven, supports local MySQL & Aiven Cloud)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartmeal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:SmartMealSecretKeyForJwtAuthentication2026SecureCollegeCanteen}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI Microservice URL
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.smartmeal=INFO
