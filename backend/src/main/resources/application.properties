spring.application.name=task-manager
# Render sets PORT env var; fallback to 8081 for local dev
server.port=${PORT:8081}

# =======================================================
# MySQL Database Configuration
# =======================================================
# On Render: set DB_URL, DB_USERNAME, DB_PASSWORD as Environment Variables.
# Local dev fallback values are used automatically when env vars are not set.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Prevent crash if DB is not yet ready (Render free tier can be slow)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1

# =======================================================
# JPA / Hibernate Configuration
# =======================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =======================================================
# Spring Security - suppress the auto-generated password warning
# =======================================================
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:disabled}

# =======================================================
# Logging
# =======================================================
logging.level.org.springframework.security=WARN
logging.level.com.example.taskmanager=INFO